<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通用在线表单与悬浮组件测试 - static.ycz.me</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-100 min-h-screen text-zinc-800 antialiased font-sans">
  <!-- 顶部导航 -->
  <header class="bg-white border-b border-zinc-200/80 sticky top-0 z-40 shadow-2xs">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-[#07c160] text-white font-bold flex items-center justify-center shadow-xs">
          Y
        </div>
        <div>
          <h1 class="font-bold text-sm text-zinc-900 leading-none">static.ycz.me 前端测试工作台</h1>
          <p class="text-[11px] text-zinc-400 mt-0.5">全组件通用表单嵌入 + 在线客服悬浮挂件验证</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 font-semibold border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>系统接口联通正常</span>
        </span>
      </div>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">
    <div class="bg-white rounded-2xl p-6 border border-zinc-200 shadow-xs space-y-2">
      <h2 class="text-lg font-bold text-zinc-900">表单嵌入说明</h2>
      <p class="text-xs text-zinc-500 leading-relaxed">
        本页面演示了通过统一脚本在外部静态网站中无缝嵌入全功能通用表单。页面在 <code>&lt;/body&gt;</code> 前引入了：
      </p>
      <pre class="bg-zinc-900 text-zinc-100 p-3 rounded-xl font-mono text-[11px] overflow-x-auto select-all">&lt;!-- 1. 引入通用一体化脚本 --&gt;
&lt;script src="/widget.js" defer&gt;&lt;/script&gt;

&lt;!-- 2. 在任意位置放置表单容器 --&gt;
&lt;div id="chat_ycz_me_full_test"&gt;&lt;/div&gt;</pre>
    </div>

    <!-- 动态表单嵌入容器 (10 种控件全功能表单) -->
    <div class="bg-white rounded-3xl p-4 sm:p-8 border border-zinc-200/80 shadow-sm">
      <div id="chat_ycz_me_full_test"></div>
    </div>
  </main>

  <!-- 引入通用挂件与表单一体化脚本 -->
  <script src="/widget.js" defer></script>
